name: Update flood data

on:
  schedule:
    - cron: '0 */3 * * *'      # every 3 hours (UTC)
  workflow_dispatch: {}         # lets you also run it manually from the Actions tab

permissions:
  contents: write               # allow the job to commit refreshed data

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Commit refreshed data
        run: |
          git config user.name  "flood-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-update flood data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
